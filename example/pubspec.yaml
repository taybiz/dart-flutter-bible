name: bible_samples
description: Executable samples of the Dart/Flutter bible doctrine.
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  equatable: ^3.0.0        # MIT
  fpdart: ^1.2.0           # MIT

dev_dependencies:
  lints: ^5.0.0            # BSD-3-Clause
  shouldly: ^0.5.0+1       # MIT
  test: ^1.25.0            # BSD-3-Clause
  dart_arch_test: ^0.3.1   # MIT
  path: ^1.9.0             # BSD-3-Clause
  melos: ^8.8.0            # Apache-2.0

# Single-package melos workspace (Topology C): this package IS the root, so
# the scripts contract lives here. The gate calls `dart run melos run ...` —
# no GitHub Actions; CI/CD is these scripts (§2.1, §2.10).
melos:
  useRootAsPackage: true
  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings
    test:
      run: dart test
    format:check:
      run: dart format --output=none --set-exit-if-changed .
    verify:
      run: |
        dart format --output=none --set-exit-if-changed .
        dart analyze --fatal-infos --fatal-warnings
        dart test
    clean:deep:
      description: Removes the deep-clean build artifacts.
      run: melos clean
