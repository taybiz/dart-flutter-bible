name: example-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
        working-directory: example
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings
        working-directory: example
      - name: Test
        run: dart test
        working-directory: example
